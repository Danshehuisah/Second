<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>kk</title>
  <link rel="stylesheet" href="kk.css" />
</head>
<body>

  <div class="top">
    <h3>Message</h3>
  </div>

  <div class="main-container">
    <div class="left">
      <div class="search-container">
        <img src="search.png" alt="">
        <input type="text" placeholder="Search Message">
        <hr>
      </div>

      <div class="info-container">
        <div class="info">
          <img src="Passport.jpg" alt="">
          <p class="name">Abubakar Suleiman</p>
          <p class="qualification">Masters</p>
        </div>

        <div class="info">
          <img src="Passport.jpg" alt="">
          <p class="name">Musa Abdulkadir</p>
          <p class="qualification">PhD</p>
        </div>

        <div class="info">
          <img src="Passport.jpg" alt="">
          <p class="name">Musa Aliyu Yakubu</p>
          <p class="qualification">BSc</p>
          <p class="text-blue-400"></p>
        </div>
      </div>
    </div>

    <div class="right">
      <div class="upload-section">
        <label for="photoInput">
          <img id="preview" src="Passport.jpg" alt="profile-image">
        </label>
        <input type="file" id="photoInput" accept="image/*">
      </div>
    </div>
  </div>

  <script src="kk.js"></script>
</body>
</html>
